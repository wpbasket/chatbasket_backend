name: Deploy chatbasket-api to Droplet

on:
  push:
    branches:
      - main
    paths:
      - 'chatbasket-api/**'
      - '.github/workflows/deploy_web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/chatbasket-api:latest \
            ./chatbasket-api

      # 4. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/chatbasket-api:latest

      # 5. Setup SSH for Droplet access
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      # 6. Deploy on DigitalOcean Droplet (Docker Compose v2)
      - name: Deploy on Droplet
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.DROPLET_IP }} "
            cd /app/chatbasket &&
            docker compose pull &&
            docker compose up -d
          "
