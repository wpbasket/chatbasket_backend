name: Deploy chatbasket-api to Oracle VM

on:
  push:
    branches:
      - main
    paths:
      - "chatbasket-api/**"
      - "deployment/**"
      - ".github/workflows/deploy_web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to GitHub Container Registry (GHCR) on the Runner
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. Set up QEMU for ARM64 Emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4.5. Build and Push ARM64 Docker image natively
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./chatbasket-api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatbasket-api:latest

      # 5. Setup SSH for Oracle VM access
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.ORACLE_IP }} >> ~/.ssh/known_hosts

      # 6. Transfer deployment configuration files
      - name: Transfer deployment files
        run: |
          scp -o StrictHostKeyChecking=no \
            ./deployment/docker-compose.yml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_IP }}:/app/chatbasket/

          scp -o StrictHostKeyChecking=no \
            ./deployment/nginx.conf \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_IP }}:/app/chatbasket/

      # 7. Deploy on Oracle VM
      - name: Deploy on Oracle VM
        run: |
          ssh ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_IP }} << 'ENDSSH'
          # Ensure the SSL directory exists (sudo required because ubuntu is not root)
          sudo mkdir -p /etc/ssl/cloudflare

          # Keep the Global AOP CA on the VM for emergency rollback only.
          # Nginx currently uses the custom zone-level AOP CA configured in nginx.conf.
          sudo wget -q https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem -O /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem

          cd /app/chatbasket

          # Create .env file with secrets
          echo "APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}" > .env
          echo "APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}" >> .env
          echo "APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}" >> .env
          echo "PERSONAL_USERNAME_KEY=${{ secrets.PERSONAL_USERNAME_KEY }}" >> .env
          echo "PERSONAL_CONTACT_KEY=${{ secrets.PERSONAL_CONTACT_KEY }}" >> .env
          echo "DATABASE_URL_PG_CB=${{ secrets.DATABASE_URL_PG_CB }}" >> .env
          echo "DATABASE_URL_PG_DEV=${{ secrets.DATABASE_URL_PG_DEV }}" >> .env
          echo "APPWRITE_FILE_PERSONAL_USERPROFILEPIC_BUCKET_ID=${{ secrets.APPWRITE_FILE_PERSONAL_USERPROFILEPIC_BUCKET_ID }}" >> .env
          echo "APPWRITE_PERSONAL_CHAT_FILES_BUCKET_ID=${{ secrets.APPWRITE_PERSONAL_CHAT_FILES_BUCKET_ID }}" >> .env
          echo 'R2_ACCOUNTS_JSON=${{ secrets.R2_ACCOUNTS_JSON }}' >> .env
          echo "R2_PRIMARY_CHAT_ACCOUNT=${{ secrets.R2_PRIMARY_CHAT_ACCOUNT }}" >> .env
          echo "R2_PRIMARY_PROFILE_ACCOUNT=${{ secrets.R2_PRIMARY_PROFILE_ACCOUNT }}" >> .env
          echo "COSMOS_CONNECTION_STRING=${{ secrets.COSMOS_CONNECTION_STRING }}" >> .env
          echo "COSMOS_DATABASE=${{ secrets.COSMOS_DATABASE }}" >> .env
          echo "COSMOS_CONTAINER=${{ secrets.COSMOS_CONTAINER }}" >> .env
          echo 'FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}' >> .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env
          echo "SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}" >> .env
          echo "MAIL_RELAY_URL=${{ secrets.MAIL_RELAY_URL }}" >> .env
          echo "MAIL_RELAY_SECRET=${{ secrets.MAIL_RELAY_SECRET }}" >> .env
          echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
          echo "DB_SELECTOR=${{ secrets.DB_SELECTOR }}" >> .env

          # Login to GHCR on the Oracle VM (Required to pull the private image)
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull and Start
          docker compose pull
          docker compose up -d --remove-orphans

          # Validate and reload Nginx after the bind-mounted config changes
          docker exec chatbasket-nginx nginx -t
          docker exec chatbasket-nginx nginx -s reload

          # --- CRITICAL CLEANUP STEP ---
          # Deletes the old "dangling" image to save disk space
          docker image prune -f

          ENDSSH
