name: Deploy chatbasket-api to Droplet

on:
  push:
    branches:
      - main
    paths:
      - "chatbasket-api/**"
      - ".github/workflows/deploy_web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to GitHub Container Registry (GHCR) on the Runner
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/chatbasket-api:latest \
            ./chatbasket-api

      # 4. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/chatbasket-api:latest

      # 5. Setup SSH for Droplet access
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      # 6. Transfer deployment configuration files
      - name: Transfer deployment files
        run: |
          scp -o StrictHostKeyChecking=no \
            ./deployment/docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.DROPLET_IP }}:/app/chatbasket/

          scp -o StrictHostKeyChecking=no \
            ./deployment/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.DROPLET_IP }}:/app/chatbasket/

      # 7. Deploy on DigitalOcean Droplet
      - name: Deploy on Droplet
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.DROPLET_IP }} << 'ENDSSH'
          # Ensure the SSL directory exists
          mkdir -p /etc/ssl/cloudflare

          # Download the Cloudflare Authenticated Origin Pull CA (Overwrite if exists to ensure freshness)
          wget -q https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem -O /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem

          cd /app/chatbasket

          # Create .env file with secrets
          echo "APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}" > .env
          echo "APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}" >> .env
          echo "APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}" >> .env
          echo "APPWRITE_DATABASE_ID=${{ secrets.APPWRITE_DATABASE_ID }}" >> .env
          echo "APPWRITE_USERS_COLLECTION_ID=${{ secrets.APPWRITE_USERS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_POSTS_COLLECTION_ID=${{ secrets.APPWRITE_POSTS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_REFRESH_TOKENS_COLLECTION_ID=${{ secrets.APPWRITE_REFRESH_TOKENS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_LIKES_COLLECTION_ID=${{ secrets.APPWRITE_LIKES_COLLECTION_ID }}" >> .env
          echo "APPWRITE_FOLLOW_COLLECTION_ID=${{ secrets.APPWRITE_FOLLOW_COLLECTION_ID }}" >> .env
          echo "APPWRITE_COMMENTS_COLLECTION_ID=${{ secrets.APPWRITE_COMMENTS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_BLOCK_COLLECTION_ID=${{ secrets.APPWRITE_BLOCK_COLLECTION_ID }}" >> .env
          echo "APPWRITE_FOLLOW_REQUESTS_COLLECTION_ID=${{ secrets.APPWRITE_FOLLOW_REQUESTS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_TEMP_OTP_COLLECTION_ID=${{ secrets.APPWRITE_TEMP_OTP_COLLECTION_ID }}" >> .env
          echo "APPWRITE_FILE_USERPROFILEPIC_BUCKET_ID=${{ secrets.APPWRITE_FILE_USERPROFILEPIC_BUCKET_ID }}" >> .env
          echo "APPWRITE_PERSONAL_DATABASE_ID=${{ secrets.APPWRITE_PERSONAL_DATABASE_ID }}" >> .env
          echo "APPWRITE_PERSONAL_USERS_COLLECTION_ID=${{ secrets.APPWRITE_PERSONAL_USERS_COLLECTION_ID }}" >> .env
          echo "APPWRITE_PERSONAL_ALONE_USERNAME_COLLECTION_ID=${{ secrets.APPWRITE_PERSONAL_ALONE_USERNAME_COLLECTION_ID }}" >> .env
          echo "PERSONAL_USERNAME_KEY=${{ secrets.PERSONAL_USERNAME_KEY }}" >> .env
          echo "DATABASE_URL_PG_CB=${{ secrets.DATABASE_URL_PG_CB }}" >> .env
          echo "DATABASE_URL_PG_DEV=${{ secrets.DATABASE_URL_PG_DEV }}" >> .env
          echo "APPWRITE_FILE_PERSONAL_USERPROFILEPIC_BUCKET_ID=${{ secrets.APPWRITE_FILE_PERSONAL_USERPROFILEPIC_BUCKET_ID }}" >> .env
          echo "COSMOS_CONNECTION_STRING=${{ secrets.COSMOS_CONNECTION_STRING }}" >> .env
          echo "COSMOS_DATABASE=${{ secrets.COSMOS_DATABASE }}" >> .env
          echo "COSMOS_CONTAINER=${{ secrets.COSMOS_CONTAINER }}" >> .env
          echo 'FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}' >> .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env
          echo "SMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}" >> .env
          echo "MAIL_RELAY_URL=${{ secrets.MAIL_RELAY_URL }}" >> .env
          echo "MAIL_RELAY_SECRET=${{ secrets.MAIL_RELAY_SECRET }}" >> .env

          # Login to GHCR on the Droplet (Required to pull the private image)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull and Start
          docker compose pull
          docker compose up -d --remove-orphans

          # --- CRITICAL CLEANUP STEP ---
          # Deletes the old "dangling" image to save disk space
          docker image prune -f

          ENDSSH
