worker_processes auto;

events {}

http {
    # -------------------------
    # WebSocket Connection header upgrade map (nginx official docs)
    # https://nginx.org/en/docs/http/websocket.html
    # When Upgrade header is present → "upgrade", otherwise → "close"
    # -------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------
    # HTTP → HTTPS redirect
    # -------------------------
    server {
        listen 80;
        server_name chatbasket.live *.chatbasket.live;

        return 301 https://$host$request_uri;
    }

    # -------------------------
    # HTTPS server (Cloudflare)
    # -------------------------
    server {
        listen 443 ssl http2;
        server_name chatbasket.live *.chatbasket.live;

        client_max_body_size 100M;

        ssl_certificate     /etc/ssl/cloudflare/origin.pem;
        ssl_certificate_key /etc/ssl/cloudflare/origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # ------------------------------------------------------------
        # CLOUDFLARE AUTHENTICATED ORIGIN PULLS
        # ------------------------------------------------------------
        # Verifies that the requester has the valid Cloudflare Client Certificate.
        ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
        ssl_verify_client on;

        # ------------------------------------------------------------
        # CLOUDFLARE IP WHITELIST
        # ------------------------------------------------------------
        # Blocks any connection not coming from Cloudflare's IP ranges.
        
        # IPv4
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;

        # IPv6
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;

        # Deny everyone else
        deny all;

        # ------------------------------------------------------------
        # WebSocket endpoint — must come before the catch-all location
        # ------------------------------------------------------------
        location /api/personal/chat/ws {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;

            # Required for WebSocket upgrade handshake (nginx.org/en/docs/http/websocket.html)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Keep long-lived WS connections alive
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------------------------
        # All other HTTP requests
        # ------------------------------------------------------------
        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
