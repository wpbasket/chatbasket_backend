services:
  api:
    image: ghcr.io/wpbasket/chatbasket-api:latest
    container_name: chatbasket-api
    restart: always
    env_file:
      - .env
    # --- MEMORY LIMIT ADDED HERE ---
    # This limits Go to 150MB of RAM.
    # It forces the app to clean up memory immediately instead of growing to crash the server.
    environment:
      - GOMEMLIMIT=150MiB
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: chatbasket-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - api