services:
  api:
    image: ghcr.io/wpbasket/chatbasket-api:latest
    container_name: chatbasket-api
    restart: always

    # 🔥 Hard container memory limit
    mem_limit: 200m

    env_file:
      - .env

    # Go internal memory control
    environment:
      - GOMEMLIMIT=150MiB

    expose:
      - "8080"

    # 🔥 Healthcheck (checks your /api/healthz endpoint)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 🔥 Official Docker log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: chatbasket-nginx
    restart: always

    # Nginx does not need much RAM
    mem_limit: 100m

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro

    depends_on:
      - api

    # Log rotation for nginx container too
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"