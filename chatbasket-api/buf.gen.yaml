# To regenerate the backend protobuf and Connect RPC files, run `cd /personaldata/cb/chatbasket_backend/chatbasket-api && buf generate`.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.16.2
    out: gen
    opt: paths=source_relative
