version: "2"
sql:
  # ==========================================
  # --- CORE ---
  # ==========================================
  # --- AUTH MODULE ---

  - schema: "db/common/migrations/"
    queries: "db/common/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "core_auth_store"
        out: "internal/modules/core/core_auth/internal/core_auth_store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

