syntax = "proto3";

package rpc_common_model.v1;

option go_package = "chatbasket-api/gen/proto/common/model;rpc_common_modelv1";

message StatusOkay {
  bool status = 1;
  string message = 2;
}

message BlockStatusFlags {
  bool isRequesterAdminBlocked = 1;
  bool isTargetAdminBlocked = 2;
  bool isRequesterUserBlockedByTarget = 3;
  bool isTargetUserBlockedByRequester = 4;
  bool isTargetProfilePrivate = 5;
}
